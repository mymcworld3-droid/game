<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>益智對戰平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="login-screen">
        <h1>益智對戰平台</h1>
        
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-guest">訪客</button>
            <button class="auth-tab" id="tab-login">登入</button>
            <button class="auth-tab" id="tab-register">註冊</button>
        </div>

        <div id="form-guest" class="auth-form active">
            <p style="margin-bottom: 2cqw; color: #aaa; font-size: 3.5cqw;">以訪客身分快速進入大廳</p>
            <button id="btn-guest-login">快速進入</button>
        </div>

        <div id="form-login" class="auth-form">
            <input type="text" id="login-account" placeholder="輸入帳號">
            <input type="password" id="login-password" placeholder="輸入密碼">
            <button id="btn-login">登入</button>
        </div>

        <div id="form-register" class="auth-form">
            <input type="text" id="reg-account" placeholder="設定帳號 (用來登入)">
            <input type="password" id="reg-password" placeholder="設定密碼">
            <input type="text" id="reg-nickname" placeholder="遊戲暱稱 (大廳顯示)">
            <button id="btn-register">註冊帳號</button>
        </div>
    </div>

    <div id="lobby-screen" style="display: none;">
        <div class="header" style="justify-content: space-between;">
            <h2 id="welcome-text"></h2>
            <div id="profile-container" style="display: none; align-items: center; gap: 2cqw;">
                <span id="exp-display" style="color: #fbbf24; font-weight: bold; font-size: 3.5cqw;">EXP: 0</span>
                <button id="btn-change-name" style="padding: 1.5cqw 3cqw; font-size: 3cqw; width: auto; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);">改名</button>
            </div>
        </div>
        <div class="main-container">
            <div class="game-list-container">
                <h3>選擇遊戲</h3>
                <div class="game-list" id="dynamic-game-list"></div>
            </div>
            <div class="player-list-container">
                <h3>上線玩家</h3>
                <ul id="player-list-ul"></ul>
            </div>
        </div>
    </div>

    <div id="game-window" style="display: none;">
        <div id="game-content"></div>
        <button id="leave-game-btn">離開遊戲</button>
    </div>

    <div id="custom-alert-modal" style="display: none;">
        <div class="custom-alert-box">
            <h3 id="custom-alert-message">提示訊息</h3>
            <button id="custom-alert-btn">確定</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/lobby.js"></script>
</body>
</html>
